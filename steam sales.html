<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NicheGaming - Steam Deals</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--main-color:#39ff14;}
body{margin:0;background:#030303;color:var(--main-color);font-family:"Orbitron", system-ui, sans-serif;}
#layout{display:grid;grid-template-columns:1fr 1100px 1fr;gap:20px;}
#main{padding:10px;}

/* SPOTLIGHT */
.spotlight{
  height:35vh;
  position:relative;
  overflow:hidden;
  display:block;
  cursor:pointer;
}
#spotlight-media{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:brightness(70%);
  transition: filter 0.3s;
}
.spotlight:hover #spotlight-media{
  filter:brightness(85%);
}
.overlay{
  position:absolute;width:100%;height:100%;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  pointer-events:none;
  text-align:center;
}
.overlay h2{font-size:2rem;margin-bottom:5px;}
.overlay p{font-size:1.2rem;}

/* TOP DEALS BELT */
#top-deals-section{padding:10px;}
#top-deals-section h2{text-align:left;margin-left:10px;}
#top-deals{overflow:hidden;white-space:nowrap;position:relative;height:100px;}
.belt{display:flex;animation:scroll 90s linear infinite;}
.belt-item{display:flex;flex-direction:column;align-items:center;margin:0 15px;cursor:pointer;}
.belt-item img{height:60px;display:block;}
.belt-item .info{font-size:0.75rem;text-align:center;margin-top:2px;}
@keyframes scroll{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}

/* FILTERS + RETURN HOME */
#filters{
  display:flex;
  gap:10px;
  margin:20px 0;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
}
#filters-left{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
}
select,input{background:#000;color:var(--main-color);border:2px solid var(--main-color);padding:10px;}
#return-home{
  padding:10px 20px;
  border:2px solid var(--main-color);
  background:#000;
  color:var(--main-color);
  text-decoration:none;
  border-radius:5px;
  transition:0.3s;
  white-space:nowrap;
}
#return-home:hover{
  background:var(--main-color);
  color:#000;
}

/* GAME LIST */
#steam-deals{display:flex;flex-direction:column;gap:10px;}
.game-card{display:flex;align-items:center;gap:15px;background:#000;border:2px solid var(--main-color);padding:10px;font-size:1.1rem;cursor:pointer;}
.game-card img{width:120px;height:60px;object-fit:cover;}
.row{display:flex;width:100%;justify-content:space-between;align-items:center;}
.row span,.row a{width:25%;text-align:center;}
.desc{font-size:0.8rem;opacity:0.8;margin-top:5px;display:none;}
a{color:var(--main-color);text-decoration:none;}
a:hover{background:var(--main-color);color:#000;}

/* BACK TO TOP */
#back-top {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 12px 20px;
  background:#000;
  color:var(--main-color);
  border:2px solid var(--main-color);
  border-radius:5px;
  text-decoration:none;
  font-weight:600;
  z-index:1000;
  transition:0.3s;
}
#back-top:hover {
  background:var(--main-color);
  color:#000;
}
/* CRT GRID */
body::before{
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background:repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.03) 0px,
    rgba(255,255,255,0.03) 1px,
    transparent 2px,
    transparent 4px
  );
  pointer-events:none;
  z-index:9999;
}
/* ========================= */
/* FINAL UNIVERSAL HOVER FIX */
/* ========================= */

button:hover,
a:hover,
#return-home:hover,
#back-top:hover,
.spotlight-btn:hover,
.menu-item:hover,
#filter-bar select:hover,
.filter-group button:hover {

  /* 🔴 kill all green fill everywhere */
  background: #000 !important;

  /* 🔴 force neon text */
  color: var(--main-color) !important;

  /* 🔥 strong glow */
  text-shadow:
    0 0 5px var(--main-color),
    0 0 10px var(--main-color),
    0 0 20px var(--main-color),
    0 0 40px var(--main-color),
    0 0 80px var(--main-color) !important;

  /* optional but nice */
  box-shadow:
    0 0 10px var(--main-color),
    0 0 20px var(--main-color);
}
/* DISCLAIMER */
.affiliate-disclaimer{
  max-width:1000px;
  margin:40px auto 80px;
  font-size:0.85rem;
  opacity:0.7;
  line-height:1.5;
}
.price-flash{
  animation: glowFlash 0.4s ease;
}

@keyframes glowFlash{
  0%{
    text-shadow: 0 0 0px var(--main-color);
    transform: scale(1);
  }
  50%{
    text-shadow:
      0 0 10px var(--main-color),
      0 0 20px var(--main-color),
      0 0 40px var(--main-color);
    transform: scale(1.05);
  }
  100%{
    text-shadow: 0 0 0px var(--main-color);
    transform: scale(1);
  }
}
/* ========================= */
/* AFFILIATE GLOBAL */
/* ========================= */

.inactive{
  display:none; /* 🔴 keeps ads hidden until ready */
}

/* ========================= */
/* SIDE BANNERS */
/* ========================= */

.affiliate-sidebar{
  position:fixed;
  top:50%;
  transform:translateY(-50%);
  width:180px;
  z-index:999;
}

.affiliate-sidebar.left{ left:10px; }
.affiliate-sidebar.right{ right:10px; }

.affiliate-stack{
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* each square */
.affiliate-item{
  background:#000;
  border:2px solid var(--main-color);
  box-shadow:0 0 10px var(--main-color);
  padding:5px;
}
.affiliate-item{
  transition:0.3s;
}

.affiliate-item:hover{
  transform:scale(1.20);
  z-index:1000;

  box-shadow:
    0 0 10px var(--main-color),
    0 0 20px var(--main-color),
    0 0 40px var(--main-color),
    0 0 80px var(--main-color);
}
/* square images */
.affiliate-item img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
}

body{
  padding-bottom:110px; /* adjust if needed */
}

/* DISCLAIMER */
.affiliate-disclaimer{
  max-width:1000px;
  margin:40px auto 80px;
  font-size:0.85rem;
  opacity:0.7;
  line-height:1.5;
}
@media(max-width:1200px){
  .affiliate-sidebar{
    display:none;
  }
}
.affiliate-item:hover{
  box-shadow:
    0 0 10px var(--main-color),
    0 0 20px var(--main-color),
    0 0 40px var(--main-color);
}
</style>
</head>
<body>

<aside></aside>
<div id="main">

<!-- SPOTLIGHT -->
<a id="spotlight-link" class="spotlight" target="_blank">
  <img id="spotlight-media">
  <div class="overlay">
    <h2 id="spotlight-title"></h2>

<div id="top-deals-section">
<h2>Top Deals Today</h2>
<div id="top-deals"><div class="belt" id="belt"></div></div>
</div>

<!-- FILTERS + RETURN HOME -->
<div id="filters">
  <div id="filters-left">
    <input id="search" placeholder="Search games...">
    <select id="discount-filter">
      <option value="all">All Discounts</option>
      <option value="30">30%+</option>
      <option value="50">50%+</option>
      <option value="70">70%+</option>
      <option value="90">90%+</option>
    </select>

      <option value="desc">Highest → Lowest Discount</option>

      <option value="price-desc">Price High → Low</option>
    </select>
<select id="currency">
  <option value="USD">USD ($)</option>
  <option value="GBP">GBP (£)</option>

</select>
  </div>
  <a id="return-home" href="index.html">Return Home</a>
</div>

<!-- GAME LIST -->
<div id="steam-deals"></div>

<!-- Back to Top Button -->
<a href="#" id="back-top">Back to Top</a>

</div>
<aside></aside>
</div>

<!-- ========================= -->

  <div class="affiliate-stack">

<script>
/* =========================
   CURRENCY SYSTEM
========================= */
let currency = "USD";
let rates = { USD: 1 };

async function fetchRates(){
  try{
    const res = await fetch("https://api.exchangerate-api.com/v4/latest/USD");
    const data = await res.json();
    rates = data.rates;
  }catch(e){
    console.log("Currency API failed, using USD");
  }
}

async function detectCurrency(){
  try{
    const res = await fetch("https://ipapi.co/json/");
    const data = await res.json();

    const country = data.country_code;

    if(country === "GB") currency = "GBP";
    else if(["DE","FR","ES","IT","NL"].includes(country)) currency = "EUR";
    else currency = "USD";

    const selector = document.getElementById("currency");
    if(selector) selector.value = currency;

  }catch(e){
    console.log("Geo detection failed, default USD");
  }
}

/* =========================
   FORMATTING
========================= */
function formatCurrency(value){
  if(currency === "GBP") return "£" + value.toFixed(2);
  if(currency === "EUR") return "€" + value.toFixed(2);
  return "$" + value.toFixed(2);
}

/* =========================
   🔥 ANIMATION + FLASH EFFECT
========================= */
function animateValue(el, start, end, duration = 500){
  let startTime = null;

  function step(timestamp){
    if(!startTime) startTime = timestamp;
    const progress = Math.min((timestamp - startTime) / duration, 1);

    const value = start + (end - start) * progress;
    el.textContent = formatCurrency(value);

    if(progress < 1){
      requestAnimationFrame(step);
    }
  }

  requestAnimationFrame(step);
}

/* ✨ NEW: glow flash effect */
function flashGlow(el){
  el.classList.add("price-flash");

  setTimeout(()=>{
    el.classList.remove("price-flash");
  }, 400);
}

/* =========================
   LIVE PRICE REFRESH
========================= */
function refreshPrices(){
  document.querySelectorAll(".price-field").forEach(el=>{
    const raw = parseFloat(el.dataset.price);

    const currentText = el.textContent.replace(/[^0-9.]/g, "");
    const currentValue = parseFloat(currentText) || 0;

    const targetValue = raw * (rates[currency] || 1);

    animateValue(el, currentValue, targetValue, 450);
    flashGlow(el); // ✨ trigger glow
  });
}

/* =========================
   THEME COLOR
========================= */
const storedColor = localStorage.getItem("nicheColor");

if(storedColor){
  document.documentElement.style.setProperty("--main-color", storedColor);

  document.querySelectorAll("h1, .game-card, a, #return-home, select, button").forEach(el=>{
    el.style.color = storedColor;
    el.style.borderColor = storedColor;
    el.style.textShadow =
      `0 0 5px ${storedColor}, 0 0 10px ${storedColor}, 0 0 20px ${storedColor}`;
  });

  document.getElementById("spotlight-title").style.color = storedColor;
  document.getElementById("spotlight-discount").style.color = storedColor;
}

/* =========================
   DATA
========================= */
let deals = [], filtered = [];
let visible = 0, chunk = 20;

/* =========================
   INIT
========================= */
async function init(){
  await fetchRates();
  await detectCurrency();

  for(let i=0;i<5;i++){
    const res = await fetch(`https://www.cheapshark.com/api/1.0/deals?storeID=1&pageNumber=${i}`);
    deals = deals.concat(await res.json());
  }

  applyFilters();
  buildTopDeals();
}

/* =========================
   FILTERS
========================= */
function applyFilters(){
  const dVal = document.getElementById("discount-filter").value;
  const sort = document.getElementById("sort-filter").value;
  const search = document.getElementById("search").value.toLowerCase();

  filtered = deals.filter(d=>{
    const s = parseFloat(d.savings);
    if(dVal !== "all" && s < parseFloat(dVal)) return false;
    if(!d.title.toLowerCase().includes(search)) return false;
    return true;
  });

  if(sort === "asc") filtered.sort((a,b)=>a.savings-b.savings);
  else if(sort === "desc") filtered.sort((a,b)=>b.savings-a.savings);
  else if(sort === "price-asc") filtered.sort((a,b)=>a.salePrice-b.salePrice);
  else if(sort === "price-desc") filtered.sort((a,b)=>b.salePrice-a.salePrice);

  visible = 0;
  document.getElementById("steam-deals").innerHTML = "";
  render();
  spotlight();
}

/* =========================
   RENDER
========================= */
function render(){
  const slice = filtered.slice(visible, visible + chunk);

  slice.forEach(g=>{
    const div = document.createElement("div");
    div.className = "game-card";

    div.innerHTML = `
      <img src="${g.thumb}">
      <div class="row">
        <span>${g.title}</span>
        <a href="https://store.steampowered.com/app/${g.steamAppID}" target="_blank">Steam</a>
        <span>${Math.round(g.savings)}%</span>
        <span class="price-field" data-price="${g.salePrice}">
          ${formatCurrency(g.salePrice * (rates[currency] || 1))}
        </span>
      </div>
      <div class="desc">${g.steamRatingText || "No tags available"}</div>
    `;

    div.onclick = ()=>{
      const desc = div.querySelector(".desc");
      desc.style.display = desc.style.display === "block" ? "none" : "block";
    };

    document.getElementById("steam-deals").appendChild(div);
  });

  visible += chunk;
}

/* =========================
   INFINITE SCROLL
========================= */
window.addEventListener("scroll",()=>{
  if(window.innerHeight + window.scrollY >= document.body.offsetHeight - 200){
    render();
  }
});

/* =========================
   SPOTLIGHT
========================= */
function spotlight(){
  const g = filtered[Math.floor(Math.random()*filtered.length)];
  if(!g) return;

  document.getElementById("spotlight-media").src =
    `https://cdn.cloudflare.steamstatic.com/steam/apps/${g.steamAppID}/header.jpg`;

  document.getElementById("spotlight-title").textContent = g.title;
  document.getElementById("spotlight-discount").textContent =
    Math.round(g.savings) + "% OFF";

  document.getElementById("spotlight-link").href =
    `https://store.steampowered.com/app/${g.steamAppID}`;
}

/* =========================
   TOP DEALS
========================= */
function buildTopDeals(){
  const belt = document.getElementById("belt");

  const top = [...deals]
    .sort((a,b)=>a.salePrice-b.salePrice)
    .slice(0,20);

  belt.innerHTML = "";
  const combined = top.concat(top);

  combined.forEach(g=>{
    const item = document.createElement("div");
    item.className = "belt-item";

    item.innerHTML = `
      <img src="${g.thumb}">
      <div class="info">
        ${g.title}<br>
        ${Math.round(g.savings)}% |
        <span class="price-field" data-price="${g.salePrice}">
          ${formatCurrency(g.salePrice * (rates[currency] || 1))}
        </span>
      </div>
    `;

    item.onclick = ()=>{
      window.open(`https://store.steampowered.com/app/${g.steamAppID}`, "_blank");
    };

    belt.appendChild(item);
  });
}

/* =========================
   EVENTS
========================= */
document.getElementById("discount-filter").onchange = applyFilters;
document.getElementById("sort-filter").onchange = applyFilters;
document.getElementById("search").oninput = applyFilters;

document.getElementById("currency").onchange = (e)=>{
  currency = e.target.value;
  refreshPrices();
};

/* =========================
   BACK TO TOP
========================= */
document.getElementById("back-top").onclick = (e)=>{
  e.preventDefault();
  window.scrollTo({top:0, behavior:"smooth"});
};

/* START */
init();
</script>
