<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Steam Deals - NicheGaming</title>
<link rel="icon" type="image/x-icon" href="nichegaming favicon.jpg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root { --main-color:#39ff14; }

* { box-sizing: border-box; margin:0; padding:0; }

body {
  font-family: "Orbitron", system-ui, sans-serif;
  background:#030303;
  color:var(--main-color);
  text-align:center;
  padding-top:0;
  overflow-x:hidden;
  animation: crtFlicker 6s infinite;
  position:relative;
}

/* Cyberpunk scanlines */
body::before {
  content:"";
  position:fixed; top:0; left:0;
  width:100%; height:100%;
  background:repeating-linear-gradient(to bottom,
    rgba(255,255,255,0.03) 0px,
    rgba(255,255,255,0.03) 1px,
    transparent 2px,
    transparent 4px);
  pointer-events:none;
  z-index:999;
}

body::after {
  content:"";
  position:fixed; top:0; left:0;
  width:100%; height:100%;
  background:radial-gradient(ellipse at center,
    rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
  pointer-events:none;
}

/* CRT flicker */
@keyframes crtFlicker {
  0%{opacity:0.98} 5%{opacity:0.95} 10%{opacity:0.98} 15%{opacity:0.94} 20%{opacity:0.98} 100%{opacity:1}
}

/* Navigation */
.menu-container {
  background:#000;
  padding:15px 30px;
  position:fixed; top:0; width:100%;
  z-index:1000;
  box-shadow:0 2px 5px rgba(0,0,0,0.5);
}
.menu { display:flex; flex-wrap:wrap; justify-content:center; gap:20px; }
.menu-item {
  color:var(--main-color);
  text-decoration:none;
  padding:10px 15px;
  background:#000;
  border-radius:5px;
  transition:0.3s;
}
.menu-item:hover {
  color:#000;
  background:var(--main-color);
  text-shadow:0 0 10px var(--main-color),0 0 20px var(--main-color),0 0 30px var(--main-color);
}

/* Title */
h1 {
  margin:40px 0 20px 0;
  text-shadow:0 0 5px var(--main-color),0 0 10px var(--main-color),0 0 20px var(--main-color),0 0 40px var(--main-color);
}

/* Filter bar */
#filter-bar { display:flex; justify-content:center; gap:15px; flex-wrap:wrap; margin-bottom:20px; }
select, .filter-group button {
  cursor:pointer; color:var(--main-color); background:#000;
  border:2px solid var(--main-color); padding:10px 15px; border-radius:5px; min-width:100px;
  transition:background 0.3s, color 0.3s;
}
select:hover, .filter-group button:hover {
  background:var(--main-color);
  color:#000;
  text-shadow:0 0 10px var(--main-color),0 0 20px var(--main-color),0 0 30px var(--main-color);
}

/* Steam Deals grid */
#steam-deals {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px; max-width:1200px; margin:0 auto 20px auto; padding:0 10px;
}
.game-card {
  background:#000;
  border:2px solid var(--main-color);
  padding:15px; border-radius:6px;
  box-shadow:0 0 10px var(--main-color),0 0 20px var(--main-color);
  transition:transform 0.3s, box-shadow 0.3s, background 0.3s;
  position:relative; overflow:hidden;
}
.game-card:hover {
  transform:scale(1.05);
  box-shadow:0 0 20px var(--main-color),0 0 40px var(--main-color);
  background:rgba(0,255,20,0.05);
}
.game-card img { width:100%; border-radius:4px; display:block; margin-top:10px; }

/* Steam link styling */
a { color:var(--main-color); text-decoration:none; transition:all 0.3s;
    text-shadow:0 0 5px var(--main-color),0 0 10px var(--main-color),0 0 20px var(--main-color);}
a:hover { color:#000; background-color:var(--main-color);
    text-shadow:0 0 10px var(--main-color),0 0 20px var(--main-color),0 0 30px var(--main-color); }

/* Return Home */
#return-home { margin:20px 0; padding:10px 20px; border:2px solid var(--main-color);
  border-radius:6px; background:#000; color:var(--main-color); text-decoration:none; transition:0.3s; display:inline-block; }
#return-home:hover { background:var(--main-color); color:#000; }

/* Spinner */
.spinner { border:8px solid #333; border-top:8px solid var(--main-color); border-radius:50%; width:60px; height:60px; animation:spin 1s linear infinite; margin:50px auto; }
@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}

/* Pagination buttons */
#pagination {
  display:flex;
  justify-content:center;
  gap:20px;
  margin:20px 0 50px 0;
}
#pagination button {
  background: #000;
  color: var(--main-color);
  border: 2px solid var(--main-color);
  padding: 10px 20px;
  border-radius: 6px;
  cursor: pointer;
  text-shadow: 0 0 5px var(--main-color), 0 0 10px var(--main-color), 0 0 20px var(--main-color);
  transition: 0.3s;
}
#pagination button:hover {
  background: var(--main-color);
  color: #000;
  text-shadow: 0 0 10px var(--main-color), 0 0 20px var(--main-color), 0 0 30px var(--main-color);
}
.spotlight{
  position:relative;
  height:60vh;
  min-height:420px;
  overflow:hidden;
  border-bottom:2px solid var(--main-color);
  box-shadow:0 0 20px var(--main-color);
}

#spotlight-image{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:brightness(35%);
}

.spotlight-overlay{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.spotlight-overlay h2{
  font-size:2rem;
  margin-bottom:10px;
  text-shadow:
  0 0 10px var(--main-color),
  0 0 20px var(--main-color),
  0 0 40px var(--main-color);
}

#spotlight-discount{
  font-size:1.5rem;
  margin-bottom:20px;
}

.spotlight-btn{
  padding:14px 28px;
  border:2px solid var(--main-color);
  background:#000;
  color:var(--main-color);
  border-radius:6px;
  text-decoration:none;
  transition:.3s;
}

.spotlight-btn:hover{
  background:var(--main-color);
  color:#000;
}
</style>
</head>

<body>
 <section class="spotlight">

<img id="spotlight-image">

<div class="spotlight-overlay">

<h2 id="spotlight-title">Featured Deal</h2>

<p id="spotlight-discount"></p>

<a id="spotlight-link" class="spotlight-btn">
View Deal on Steam
</a>

</div>

</section>

</section>

<h1>Steam Deals</h1>
<a id="return-home" href="index.html">Return Home</a>

<div id="filter-bar">
  <select id="discount-filter">
    <option value="all">All Discounts</option>
    <option value="30">30%+</option>
    <option value="40">40%+</option>
    <option value="50">50%+</option>
    <option value="60">60%+</option>
    <option value="70">70%+</option>
    <option value="80">80%+</option>
    <option value="90">90%+</option>
  </select>
  <select id="sort-filter">
    <option value="desc">Highest → Lowest Discount</option>
    <option value="asc">Lowest → Highest Discount</option>
  </select>
</div>

<div id="loading" class="spinner"></div>
<div id="steam-deals"></div>

<div id="pagination">
  <button id="prev-btn">Previous</button>
  <button id="next-btn">Next</button>
</div>

<script>

// Apply stored color from index
const storedColor = localStorage.getItem("nicheColor");
if(storedColor){
  document.documentElement.style.setProperty("--main-color", storedColor);

  // Update elements that use --main-color dynamically
  document.querySelectorAll("h1, .game-card, a, #return-home, select, button").forEach(el=>{
    el.style.color = storedColor;
    el.style.borderColor = storedColor;
    el.style.textShadow = `0 0 5px ${storedColor}, 0 0 10px ${storedColor}, 0 0 20px ${storedColor}`;
  });
}

const container = document.getElementById("steam-deals");
const loading = document.getElementById("loading");
const discountFilter = document.getElementById("discount-filter");
const sortFilter = document.getElementById("sort-filter");
const prevBtn = document.getElementById("prev-btn");
const nextBtn = document.getElementById("next-btn");

let deals = [];
let filteredDeals = [];
let currentPage = 1;
const dealsPerPage = 20;

// Lazy loading images
const lazyObserver = new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      const img = entry.target;
      img.src = img.dataset.src;
      lazyObserver.unobserve(img);
    }
  });
},{rootMargin:"200px 0px", threshold:0.01});

// Load deals
async function loadDeals(){
  try{
    deals = [];
    for(let page=0; page<10; page++){
      const res = await fetch(`https://www.cheapshark.com/api/1.0/deals?storeID=1&pageNumber=${page}&pageSize=100`);
      const data = await res.json();
      if(data.length===0) break;
      deals = deals.concat(data);
    }
    applyFilters();
    loading.style.display="none";
  }catch(err){
    console.error(err);
    container.innerHTML = `<div style="color:${storedColor || "#39ff14"};">Failed to load deals.</div>`;
  }
}

function applyFilters(){
  const discountVal = discountFilter.value;
  filteredDeals = deals.filter(d=>{
    if(discountVal==="all") return true;
    return Math.round(d.savings) >= parseInt(discountVal);
  });
  if(sortFilter.value==="asc") filteredDeals.sort((a,b)=>a.savings-b.savings);
  else filteredDeals.sort((a,b)=>b.savings-a.savings);

  loadSpotlight();

  showPage(1);
}

function displayDeals(list){
  container.innerHTML="";
  list.forEach(game=>{
    const card = document.createElement("div");
    card.className="game-card";
    card.innerHTML=`
      <h3>${game.title}</h3>
      <a href="https://store.steampowered.com/app/${game.steamAppID}">View on Steam</a>
      <p class="discount">${Math.round(game.savings)}% OFF</p>
      <p><span style="text-decoration:line-through;opacity:0.6;">$${game.normalPrice}</span> <strong>$${game.salePrice}</strong></p>
      <img data-src="${game.thumb}" alt="${game.title}">
    `;
    container.appendChild(card);
    lazyObserver.observe(card.querySelector("img"));
  });
  updateColors(storedColor || "#39ff14");
}

// Pagination
function showPage(page){
  currentPage = page;
  const start = (page-1)*dealsPerPage;
  const end = start + dealsPerPage;
  displayDeals(filteredDeals.slice(start,end));
}

prevBtn.addEventListener("click", ()=>{ if(currentPage>1) showPage(currentPage-1); });
nextBtn.addEventListener("click", ()=>{ if(currentPage*dealsPerPage<filteredDeals.length) showPage(currentPage+1); });

discountFilter.addEventListener("change", applyFilters);
sortFilter.addEventListener("change", applyFilters);

// Update colors dynamically
function updateColors(color){
  document.body.style.color=color;
  document.querySelector("h1").style.textShadow=`0 0 5px ${color},0 0 10px ${color},0 0 20px ${color},0 0 40px ${color}`;

  document.querySelectorAll(".game-card").forEach(card=>{
    card.style.borderColor=color;
    card.style.boxShadow=`0 0 10px ${color},0 0 20px ${color}`;
    card.querySelectorAll("h3,p").forEach(el=>el.style.color=color);
  });

  document.querySelectorAll("a").forEach(link=>{
    link.style.color=color;
    link.style.textShadow=`0 0 5px ${color},0 0 10px ${color},0 0 20px ${color}`;
  });

  document.querySelectorAll("select").forEach(select=>{
    select.style.color=color;
    select.style.borderColor=color;
  });

  const returnBtn=document.getElementById("return-home");
  returnBtn.style.color=color;
  returnBtn.style.borderColor=color;
  returnBtn.style.textShadow=`0 0 5px ${color},0 0 10px ${color},0 0 20px ${color}`;

  const paginationBtns = document.querySelectorAll("#pagination button");
  paginationBtns.forEach(btn => {
    btn.style.color = color;
    btn.style.borderColor = color;
    btn.style.textShadow = `0 0 5px ${color},0 0 10px ${color},0 0 20px ${color}`;
  });
}



loadDeals();

function loadSpotlight(){

const randomDeal = filteredDeals[Math.floor(Math.random()*filteredDeals.length)];

if(!randomDeal) return;

document.getElementById("spotlight-title").textContent = randomDeal.title;

document.getElementById("spotlight-discount").textContent =
Math.round(randomDeal.savings) + "% OFF";

document.getElementById("spotlight-link").href =
`https://store.steampowered.com/app/${randomDeal.steamAppID}`;

document.getElementById("spotlight-image").src =
`https://cdn.cloudflare.steamstatic.com/steam/apps/${randomDeal.steamAppID}/header.jpg`;

}
</script>
</body>
</html>
