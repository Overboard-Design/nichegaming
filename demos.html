<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Steam Demos - NicheGaming</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root { --main-color:#39ff14; }
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:"Orbitron",system-ui,sans-serif;
  background:#030303;
  color:var(--main-color);
  text-align:center;
  padding-top:100px;
  animation:crtFlicker 6s infinite;
}
@keyframes crtFlicker{0%{opacity:.98}5%{opacity:.95}10%{opacity:.98}15%{opacity:.94}20%{opacity:.98}100%{opacity:1}}
h1{
  margin:40px 0 20px 0;
  text-shadow:0 0 5px var(--main-color),0 0 10px var(--main-color),0 0 20px var(--main-color),0 0 40px var(--main-color);
}
/* grid */
#demo-list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
  max-width:1200px;
  margin:0 auto 40px auto;
  padding:0 10px;
}
.game-card{
  background:#000;
  border:2px solid var(--main-color);
  padding:15px;
  border-radius:6px;
  box-shadow:0 0 10px var(--main-color),0 0 20px var(--main-color);
  transition:.3s;
}
.game-card:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px var(--main-color),0 0 40px var(--main-color);
}
.game-card iframe{
  width:100%;
  height:200px;
  border-radius:4px;
  margin-top:10px;
}
/* Links */
a{
  color:var(--main-color);
  text-decoration:none;
  text-shadow:0 0 5px var(--main-color),0 0 10px var(--main-color);
}
a:hover{
  background:var(--main-color);
  color:#000;
}
/* Return Home */
#return-home{
  margin:20px 0;
  padding:10px 20px;
  border:2px solid var(--main-color);
  background:#000;
  color:var(--main-color);
  display:inline-block;
  border-radius:6px;
}
#return-home:hover{
  background:var(--main-color);
  color:#000;
}
/* Color picker */
#color-picker{
  position:fixed;top:10px;left:10px;z-index:1000;
}
</style>
</head>
<body>

<h1>Steam Demos</h1>
<a id="return-home" href="index.html">Return Home</a>
<div id="demo-list"></div>
<input type="color" id="color-picker" value="#39ff14">

<script>
// Manual list of demos: fill in name, appid, youtubeId
const demos = [
  { name:"Wanderburg", appid:"3624140", youtubeId:"pUsprNYfxw0" },
  { name:"STUNTBOOST", appid:"2999500", youtubeId:"bKrkkMWMtwA" },
  { name:"ATMOSFAR", appid:"1798230", youtubeId:"VJJ4PQx34iQ" },
  // ... add up to 200
];

const container = document.getElementById("demo-list");

function displayDemos(list){
  container.innerHTML="";
  list.forEach(game=>{
    const card = document.createElement("div");
    card.className="game-card";
    const videoEmbed = `<iframe src="https://www.youtube.com/embed/${game.youtubeId}" title="${game.name}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
    card.innerHTML = `
      <h3>${game.name}</h3>
      <a href="https://store.steampowered.com/app/${game.appid}">View Demo on Steam</a>
      ${videoEmbed}
    `;
    container.appendChild(card);
  });
}

displayDemos(demos);

// Color picker
const colorPicker = document.getElementById("color-picker");
colorPicker.addEventListener("input", e=>{
  document.documentElement.style.setProperty("--main-color", e.target.value);
});
</script>
</body>
</html>
