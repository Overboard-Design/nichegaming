<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title> Pre-Release Steam Demos - NicheGaming</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root { --main-color:#39ff14; }
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:"Orbitron",system-ui,sans-serif;
  background:#030303;
  color:var(--main-color);
  text-align:center;
  padding-top:100px;
  animation:crtFlicker 6s infinite;
}
@keyframes crtFlicker{0%{opacity:.98}5%{opacity:.95}10%{opacity:.98}15%{opacity:.94}20%{opacity:.98}100%{opacity:1}}
h1{
  margin:40px 0 20px 0;
  text-shadow:0 0 5px var(--main-color),0 0 10px var(--main-color),0 0 20px var(--main-color),0 0 40px var(--main-color);
}
/* grid */
#demo-list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
  max-width:1200px;
  margin:0 auto 40px auto;
  padding:0 10px;
}
.game-card{
  background:#000;
  border:2px solid var(--main-color);
  padding:15px;
  border-radius:6px;
  box-shadow:0 0 10px var(--main-color),0 0 20px var(--main-color);
  transition:.3s;
}
.game-card:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px var(--main-color),0 0 40px var(--main-color);
}
.game-card iframe{
  width:100%;
  height:200px;
  border-radius:4px;
  margin-top:10px;
}
/* Links */
a{
  color:var(--main-color);
  text-decoration:none;
  text-shadow:0 0 5px var(--main-color),0 0 10px var(--main-color);
}
a:hover{
  background:var(--main-color);
  color:#000;
}
/* Return Home */
#return-home{
  margin:20px 0;
  padding:10px 20px;
  border:2px solid var(--main-color);
  background:#000;
  color:var(--main-color);
  display:inline-block;
  border-radius:6px;
}
#return-home:hover{
  background:var(--main-color);
  color:#000;
}
/* Color picker */
#color-picker{
  position:fixed;top:10px;left:10px;z-index:1000;
}
</style>
</head>
<body>

<h1>Steam Demos</h1>
<a id="return-home" href="index.html">Return Home</a>
<div id="demo-list"></div>
<input type="color" id="color-picker" value="#39ff14">

<script>
// Manual list of demos: fill in name, appid, youtubeId
const demos = [
  { name:"Wanderburg", appid:"3624140", youtubeId:"pUsprNYfxw0" },
  { name:"STUNTBOOST", appid:"2999500", youtubeId:"bKrkkMWMtwA" },
  { name:"ATMOSFAR", appid:"1798230", youtubeId:"VJJ4PQx34iQ" },
  { name:"Tabletop Tavern", appid:"3337380", youtubeId:"Y_Y4bJW8rtk" },
  { name:"Kalit", appid:"3789230", youtubeId:"352atYFk2fI" },
  { name:"Wild West Pioneers", appid:"3222640", youtubeId:"g1pauVygi9g" },
  { name:"We Gotta Go", appid:"3967470", youtubeId:"-jIPf5_utOc" },
  { name:"SpaceCraft", appid:"3276050", youtubeId:"iytEPtNOgzk" },
  { name:"The Caribou Trail", appid:"3065030", youtubeId:"kX0dCc5524Y" },
  { name:"Armatus", appid:"3660710", youtubeId:"jcre8jd7G7g" },
  { name:"Highreach", appid:"2620450", youtubeId:"3dCbFDadD28" },
  { name:"Don't Kill Them All", appid:"2322260", youtubeId:"ev5Iob6xLpE" },
  { name:"Blades of Fire", appid:"2091020", youtubeId:"_U8TncLXi3A" },
  { name:"Lens Of Fear", appid:"3881530", youtubeId:"qA3Ht7eSr4w" },
  { name:"Windrose", appid:"3041230", youtubeId:"lfNBIQqy19o" },
  { name:"Western_Rye", appid:"2358630", youtubeId:"xnu1EF7WgVw" },
  { name:"Among the Trolls", appid:"1675260", youtubeId:"effBwVzPlz8" },
  { name:"Road to Vostok", appid:"1963610", youtubeId:"OTFgTRsz43Q" },
  { name:"Dinoblade", appid:"4106740", youtubeId:"dj9KtCSlydM" },
  { name:"Starship Troopers: Ultimate Bug War!", appid:"4307720", youtubeId:"dx659c_7BLk" },
  { name:"Guardians of the Wild Sky", appid:"4359380", youtubeId:"pn_DQszx33Y" },
  { name:"Kiipluu", appid:"3826710", youtubeId:"rZufMn-7xxs" },
  { name:"Skate Style", appid:"3862790", youtubeId:"GecAW2jK5cQ" },
  { name:"Burglin' Gnomes", appid:"3844970", youtubeId:"yfnYqK2IYZ8" },
  { name:"Blind Descent", appid:"1209970", youtubeId:"p2eJY6HyYmE" },
  { name:"Legionbound", appid:"4283360", youtubeId:"FU6AtbWgg1k" },
  { name:"Pickle Petey", appid:"4250420", youtubeId:"qDIT7QPMOSs" },

  // ... add up to 200
];

const container = document.getElementById("demo-list");

function displayDemos(list){
  container.innerHTML="";
  list.forEach(game=>{
    const card = document.createElement("div");
    card.className="game-card";
    const videoEmbed = `<iframe src="https://www.youtube.com/embed/${game.youtubeId}" title="${game.name}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
    card.innerHTML = `
      <h3>${game.name}</h3>
      <a href="https://store.steampowered.com/app/${game.appid}">View Demo on Steam</a>
      ${videoEmbed}
    `;
    container.appendChild(card);
  });
}

displayDemos(demos);

// Color picker
const colorPicker = document.getElementById("color-picker");
colorPicker.addEventListener("input", e=>{
  document.documentElement.style.setProperty("--main-color", e.target.value);
});
</script>
</body>
</html>
