<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Steam Demos - NicheGaming</title>
<link rel="icon" type="image/x-icon" href="nichegaming favicon.jpg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root { --main-color:#39ff14; }
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:"Orbitron",system-ui,sans-serif;
  background:#030303;
  color:var(--main-color);
  text-align:center;
  animation:crtFlicker 6s infinite;
  scroll-behavior:smooth;
}
@keyframes crtFlicker{
0%{opacity:.98}5%{opacity:.95}10%{opacity:.98}15%{opacity:.94}20%{opacity:.98}100%{opacity:1}
}
h1{
  margin:40px 0 20px 0;
  text-shadow:0 0 5px var(--main-color),0 0 10px var(--main-color),0 0 20px var(--main-color),0 0 40px var(--main-color);
}
#demo-list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
  max-width:1200px;
  margin:20px auto 40px auto;
  padding:0 10px;
}
.game-card{
  background:#000;
  border:2px solid var(--main-color);
  padding:15px;
  border-radius:6px;
  box-shadow:0 0 10px var(--main-color),0 0 20px var(--main-color);
  transition:.3s, box-shadow 0.5s;
  cursor:pointer;
  position: relative;
}
.game-card:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px var(--main-color),0 0 40px var(--main-color), 0 0 60px var(--main-color);
}
.game-card h3{
  margin-bottom:10px;
  text-shadow:0 0 5px var(--main-color),0 0 10px var(--main-color);
}
a{
  color:var(--main-color);
  text-decoration:none;
  text-shadow:0 0 5px var(--main-color),0 0 10px var(--main-color);
}
a:hover{
  background:var(--main-color);
  color:#000;
}
.video-container{
  position:relative;
}
.video-container img{
  width:100%;
  border-radius:4px;
  display:block;
}
.play-button{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  width:60px; height:60px;
  background:rgba(0,0,0,0.7);
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  transition:0.3s;
}
.play-button::after{
  content:"";
  border-style:solid;
  border-width:15px 0 15px 25px;
  border-color:transparent transparent transparent var(--main-color);
  display:block;
  margin-left:5px;
}
.play-button:hover{
  background:rgba(0,0,0,0.9);
}

.spotlight{
  position: relative;
  height: 70vh;
  min-height: 420px;
  overflow: hidden;
  border-bottom: 2px solid var(--main-color);
  box-shadow: 0 0 20px var(--main-color);
}
.video-wrapper{
  position:absolute;
  top:0; left:0; width:100%; height:100%; overflow:hidden; z-index:1;
}
.video-wrapper iframe{
  position:absolute;
  top:50%; left:50%;
  width:177.78vh; height:100vh;
  min-width:100%; min-height:100%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  filter:brightness(70%) contrast(120%);
  transition:filter 1s, opacity 1s;
  animation:spotlightPulse 6s infinite;
}
@keyframes spotlightPulse {
  0%,100%{ filter: brightness(70%) contrast(120%); }
  50%{ filter: brightness(85%) contrast(130%); }
}
.spotlight-overlay{
  position:relative; z-index:2; height:100%;
  display:flex; flex-direction:column;
  justify-content:center; align-items:center; text-align:center;
}
.spotlight-overlay h2{
  font-size:2rem;
  text-shadow:0 0 10px var(--main-color),0 0 20px var(--main-color),0 0 40px var(--main-color);
}
.spotlight-btn{
  margin-top:20px;
  padding:14px 28px;
  border:2px solid var(--main-color);
  background:#000;
  color:var(--main-color);
  text-decoration:none;
  border-radius:6px;
  transition:0.3s;
}
.spotlight-btn:hover{
  background:var(--main-color);
  color:#000;
}
#return-home{
  margin:20px 0;
  padding:10px 20px;
  border:2px solid var(--main-color);
  background:#000;
  color:var(--main-color);
  display:inline-block;
  border-radius:6px;
}
#return-home:hover{
  background:var(--main-color);
  color:#000;
}
#search-bar{
  margin:20px 0;
  padding:10px;
  width:90%;
  max-width:400px;
  border:2px solid var(--main-color);
  border-radius:6px;
  background:#000;
  color:var(--main-color);
  text-align:center;
}
#back-to-top{
  position:fixed;
  bottom:20px; right:20px;
  padding:10px 15px;
  background:#000;
  border:2px solid var(--main-color);
  color:var(--main-color);
  border-radius:6px;
  cursor:pointer;
  display:none;
  z-index:10;
  transition:0.3s;
}
#back-to-top:hover{
  background:var(--main-color);
  color:#000;
}
</style>
</head>
<body>

  </div>

    <a id="spotlight-link" class="spotlight-btn" target="_blank">Play Demo on Steam</a>

// Spotlight setup
let spotlightPlayer;

function getRandomDemo() {
  return demos[Math.floor(Math.random() * demos.length)];
}

function loadSpotlight(demo) {
  document.getElementById("spotlight-title").textContent = demo.name;
  document.getElementById("spotlight-link").href = `https://store.steampowered.com/app/${demo.appid}`;

  if (spotlightPlayer) {
    spotlightPlayer.loadVideoById(demo.youtubeId);
  } else {
    spotlightPlayer = new YT.Player('spotlight-video', {
      videoId: demo.youtubeId,
      playerVars: {
        autoplay: 1,
        controls: 0,
        mute: 1,
        modestbranding: 1,
        rel: 0,
        loop: 1,
        playlist: demo.youtubeId
      },
      events: { 'onStateChange': onSpotlightStateChange }
    });
  }
}

function onSpotlightStateChange(event) {
  if(event.data === YT.PlayerState.ENDED){
    loadSpotlight(getRandomDemo());
  }
}

// API callback
function onYouTubeIframeAPIReady() {
  loadSpotlight(getRandomDemo());
}

// Demo list with play overlay
const container = document.getElementById("demo-list");
function displayDemos(list){
  container.innerHTML="";
  list.forEach(game=>{
    const card=document.createElement("div");
    card.className="game-card";
    const thumb=`https://img.youtube.com/vi/${game.youtubeId}/hqdefault.jpg`;
    card.innerHTML=`
      <h3>${game.name}</h3>
      <a href="https://store.steampowered.com/app/${game.appid}" target="_blank">View Demo on Steam</a>
      <div class="video-container">
        <img src="${thumb}" alt="${game.name} Thumbnail" data-video="${game.youtubeId}">
        <div class="play-button"></div>
      </div>
    `;
    container.appendChild(card);
  });

  document.querySelectorAll(".video-container img, .video-container .play-button").forEach(el=>{
    el.addEventListener("click", e=>{
      const containerDiv = el.closest(".video-container");
      const vidId = containerDiv.querySelector("img").dataset.video;
      const iframe = document.createElement("iframe");
      iframe.src=`https://www.youtube.com/embed/${vidId}?autoplay=1&modestbranding=1&rel=0`;
      iframe.frameBorder="0";
      iframe.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
      iframe.allowFullscreen=true;
      iframe.style.width="100%";
      iframe.style.height="200px";
      containerDiv.innerHTML="";
      containerDiv.appendChild(iframe);
    });
  });
}
displayDemos(demos);

// Search filter
const searchBar=document.getElementById("search-bar");
searchBar.addEventListener("input", e=>{
  const term=e.target.value.toLowerCase();
  const filtered=demos.filter(d=>d.name.toLowerCase().includes(term));
  displayDemos(filtered);
});

// Back to top
const backTop=document.getElementById("back-to-top");
window.addEventListener("scroll", ()=>{
  backTop.style.display=(window.scrollY>400)?"block":"none";
});
backTop.addEventListener("click", ()=>window.scrollTo({top:0,behavior:"smooth"}));
</script>
