<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Steam Demos - NicheGaming</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

<style>

:root { --main-color:#39ff14; }

*{box-sizing:border-box;margin:0;padding:0;}

body{
font-family:"Orbitron",system-ui,sans-serif;
background:#030303;
color:var(--main-color);
text-align:center;
padding-top:100px;
animation:crtFlicker 6s infinite;
}

@keyframes crtFlicker{
0%{opacity:.98}5%{opacity:.95}10%{opacity:.98}15%{opacity:.94}20%{opacity:.98}100%{opacity:1}
}

h1{
margin:40px 0 20px 0;
text-shadow:
0 0 5px var(--main-color),
0 0 10px var(--main-color),
0 0 20px var(--main-color),
0 0 40px var(--main-color);
}

/* grid */

#demo-list{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
max-width:1200px;
margin:0 auto 40px auto;
padding:0 10px;
}

.game-card{
background:#000;
border:2px solid var(--main-color);
padding:15px;
border-radius:6px;
box-shadow:0 0 10px var(--main-color),0 0 20px var(--main-color);
transition:.3s;
}

.game-card:hover{
transform:scale(1.05);
box-shadow:0 0 20px var(--main-color),0 0 40px var(--main-color);
}

.game-card img{
width:100%;
border-radius:4px;
margin-top:10px;
}

a{
color:var(--main-color);
text-decoration:none;
text-shadow:0 0 5px var(--main-color),0 0 10px var(--main-color);
}

a:hover{
background:var(--main-color);
color:#000;
}

/* spinner */

.spinner{
border:8px solid #333;
border-top:8px solid var(--main-color);
border-radius:50%;
width:60px;
height:60px;
animation:spin 1s linear infinite;
margin:50px auto;
}

@keyframes spin{
0%{transform:rotate(0)}
100%{transform:rotate(360deg)}
}

#return-home{
margin:20px 0;
padding:10px 20px;
border:2px solid var(--main-color);
background:#000;
color:var(--main-color);
display:inline-block;
border-radius:6px;
}

#return-home:hover{
background:var(--main-color);
color:#000;
}

</style>
</head>

<body>

<h1>Steam Demos</h1>

<a id="return-home" href="index.html">Return Home</a>

<div id="loading" class="spinner"></div>

<div id="demo-list"></div>

<input type="color" id="color-picker" value="#39ff14"
style="position:fixed;top:10px;left:10px;z-index:1000;">

<script>

const container = document.getElementById("demo-list")
const loading = document.getElementById("loading")
const colorPicker = document.getElementById("color-picker")

async function loadDemos(){

try{

const res = await fetch("https://api.steampowered.com/ISteamApps/GetAppList/v2/")
const data = await res.json()

let apps = data.applist.apps

/* find demos */

let demos = apps.filter(app =>
app.name.toLowerCase().includes("demo")
)

/* take latest 1000 */

demos = demos.slice(-1000).reverse()

displayDemos(demos)

loading.style.display="none"

}catch(err){

loading.style.display="none"

container.innerHTML = "<p>Failed to load demos.</p>"

console.error(err)

}

}

function displayDemos(list){

container.innerHTML=""

list.forEach(game=>{

const card = document.createElement("div")

card.className="game-card"

card.innerHTML = `
<h3>${game.name}</h3>
<a href="https://store.steampowered.com/app/${game.appid}">
View Demo
</a>
<img src="https://cdn.cloudflare.steamstatic.com/steam/apps/${game.appid}/header.jpg">
`

container.appendChild(card)

})

}

/* color picker */

colorPicker.addEventListener("input",e=>{

document.documentElement.style.setProperty("--main-color",e.target.value)

})

loadDemos()

</script>

</body>
</html>
